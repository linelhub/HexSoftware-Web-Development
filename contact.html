<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Navigation Bar-->
    <header>
        <nav class="navbar">
            <a href="contact.html" class="logo">DevBlog</a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="create-post.html">Create Post</a></li>
            </ul>
        </nav>
    </header>
    <!--Contact Section-->
    <main>
        <section class="contact-section">
            <span class="categorry-label">GET IN TOUCH</span>
            <h1>Contact DevBlog</h1>
            <p class="contact-intro">
                Have a question, suggestion, or technology topic you'd like us to cover? send us a message.
            </p>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea name="message" id="message" rows="6" placeholder="Write your message..." required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <p id="contactMessage" class="contact-message"></p>
        </section>
    </main>
    <!--Footer-->
    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
