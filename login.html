<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Navigation Bar-->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">DevBlog</a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="create-post.html">Create Post</a></li>
            </div>
        </nav>
    </header>
    <main class="auth-container">
        <div class="form-group">
            <h1>Welcome Back</h1>
            <p>Login to your DevBlog account.</p>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p>Don't have an account? <a href="register.html" class="btw">Create an account</a></p>
            
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
