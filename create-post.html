<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog | Create Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Navigation-->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">DevBlog</a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="create-post.html">Create Post</a></li>
            </ul>
        </nav>
    </header>
        <!--Create Post-->
        <main>
            <section class="create-post-section">
                <span class="category-label">PUBLISH AN ARTICLE</span>
                <h1>Create a New Post</h1>
                <p class="create-post-intro">Share useful technology knowledge, ideas and solutions with the DevBlog community.</p>

                <form id="postForm" class="post-form">
                    <div class="form-group">
                        <label for="postTitle">Post Title</label>
                        <input type="text" id="postTitle" placeholder="Enter your article title" required>
                    </div>
                    <div class="form-group">
                        <label for="postCategory">Category</label>
                        <select id="postCategory" required>
                            <option value="">Select a category</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="IoT">IoT</option>
                            <option value="Digital Skills">Digital Skills</option>
                            <option value="Technology">Technology</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="postContent">Article Content</label>
                        <textarea id="postContent" rows="12" placeholder="Write your article here..." required>
                        </textarea>
                    </div>
                    <button type="submit" class="btn">Publish Post</button>
                </form>
            </section>
        </main>
    <!--Footer-->
    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved</p>
    </footer>
    <script src="js/script.js"></script>
    
</body>
</html>
