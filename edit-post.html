<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Edit Article | DevBlog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--Navigation Bar-->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">DevBlog</a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>

            </ul>
        </nav>
    </header>

    <main class="create-post-container">

        <h1>Edit Article</h1>

        <form id="editPostForm" class="edit-post-form">

            <label for="editTitle">Article Title</label>
            <input type="text" id="editTitle" required>

            <label for="editCategory">Category</label>
            <input type="text" id="editCategory" required>

            <label for="editContent">Article Content</label>
            <textarea id="editContent" rows="12" required></textarea>

            <button type="submit">Update Article</button>

        </form>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
